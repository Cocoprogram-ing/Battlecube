<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlockWorld</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14202b;--card:#1d2f3d;--line:#3f5f78;--sky:#87ceeb;--accent:#ffb627;--txt:#f2f7fa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:'Pixelify Sans',ui-monospace,monospace;color:var(--txt)}
canvas{display:block;width:100%;height:100%}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,24,36,.55);z-index:5}
.panel[hidden]{display:none}
.card{width:min(380px,92vw);background:var(--card);border:3px solid var(--line);box-shadow:6px 6px 0 var(--ink);padding:24px;display:grid;gap:12px}
h1{margin:0;font-size:38px;color:var(--accent)} h2{margin:0;font-size:26px}
p{margin:0;color:#b8cddb}
input,button{font:inherit;font-size:18px;padding:10px 12px;border:3px solid var(--line);background:var(--ink);color:var(--txt);outline:none}
input:focus-visible,button:focus-visible{border-color:var(--accent)}
button{cursor:pointer;background:var(--accent);color:var(--ink);border-color:var(--ink);font-weight:700}
button.alt{background:var(--line);color:var(--txt)}
button:hover{filter:brightness(1.1)}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0;text-transform:uppercase}
#err{color:#ff8a80;min-height:1.2em}
#code{font-size:44px;letter-spacing:6px;color:var(--accent);text-align:center}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px;pointer-events:none;mix-blend-mode:difference}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
#hotbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:rgba(10,24,36,.6)}
#hotbar div{width:46px;height:46px;border:3px solid #0006;position:relative}
#hotbar div.sel{border-color:#fff;transform:translateY(-6px)}
#hotbar span{position:absolute;left:3px;top:0;font-size:13px;text-shadow:1px 1px #000}
#hud{position:fixed;top:10px;left:12px;font-size:16px;text-shadow:2px 2px #0008;pointer-events:none}
#chat{position:fixed;left:12px;bottom:80px;width:min(460px,90vw);z-index:4}
#log div{background:rgba(10,24,36,.6);padding:3px 8px;margin-top:2px;word-break:break-word;animation:fade 10s forwards}
#log div b{color:var(--accent)} #log div i{color:#b8cddb}
#chat.open #log div{animation:none;opacity:1}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
#ci{display:none;width:100%;margin-top:6px}
@media (prefers-reduced-motion:reduce){#log div{animation-duration:1ms;animation-delay:10s}}
#hp{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:min(300px,70vw);height:20px;background:#0009;border:3px solid #000a;z-index:3}
#hp i{position:absolute;inset:0 auto 0 0;width:100%;background:hsl(120,70%,42%);transition:width .15s}
#hp b{position:absolute;inset:0;text-align:center;font-size:14px;line-height:15px;text-shadow:1px 1px #000}
#flash{position:fixed;inset:0;background:#d00;opacity:0;pointer-events:none;transition:opacity .35s;z-index:3}
#hud{white-space:pre}
</style></head><body>
<canvas id="cv"></canvas><div id="cross"></div><div id="hotbar"></div><div id="hud"></div><div id="hp"><i id="hpf"></i><b id="hpt">100</b></div><div id="flash"></div>
<div id="chat"><div id="log"></div><input id="ci" maxlength="200" placeholder="Message, Enter to send"></div>

<div id="menu" class="panel"><div class="card">
  <h1>BlockWorld</h1>
  <p>Build with friends on a 20×20 platform.</p>
  <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
  <button id="create">Create world</button>
  <div class="row"><input id="jcode" maxlength="5" placeholder="Code" autocomplete="off"><button id="join" class="alt">Join world</button></div>
  <div id="err"></div>
</div></div>

<div id="pause" class="panel" hidden><div class="card">
  <h2>Paused</h2>
  <div id="codebox" hidden><p>Friends can join with this code:</p><div id="code"></div></div>
  <button id="openw" hidden>Open world</button>
  <button id="resume">Resume</button>
  <p>E switch hotbar · WASD move · Space jump · Left click break/attack · Right click place · 1–0 or wheel to pick a block · T chat</p>
</div></div>

<div id="dead" class="panel" hidden style="z-index:8;background:rgba(110,10,10,.6)"><div class="card">
  <h2>You died</h2><button id="respawn">Respawn</button><button id="leave" class="alt">Leave world</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), cv=$('cv'), ci=$('ci');
const COLORS=[0xe53935,0xfb8c00,0xfdd835,0x43a047,0x00acc1,0x1e66f5,0x8e24aa,0xec407a,0xf5f5f5,0x5d4037];
const K=(x,y,z)=>x+','+y+','+z;

// ---------- scene ----------
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,35,110);
const cam=new THREE.PerspectiveCamera(75,1,.1,200);cam.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xffffff,0x6b7f8f,.95));
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(.5,1,.3);scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const tc=document.createElement('canvas');tc.width=tc.height=16;const g=tc.getContext('2d');
g.fillStyle='#fff';g.fillRect(0,0,16,16);g.strokeStyle='#aaa';g.strokeRect(.5,.5,15,15);
const tex=new THREE.CanvasTexture(tc);tex.magFilter=THREE.NearestFilter;
const mats=COLORS.map(c=>new THREE.MeshLambertMaterial({color:c,map:tex}));
const geo=new THREE.BoxGeometry(1,1,1);
const hl=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.02,1.02,1.02)),new THREE.LineBasicMaterial({color:0}));
hl.visible=false;scene.add(hl);

const blocks=new Map(),meshes=new Map();
function setBlock(x,y,z,c){
  const k=K(x,y,z),o=meshes.get(k);
  if(o){scene.remove(o);meshes.delete(k);blocks.delete(k)}
  if(c>=0){const m=new THREE.Mesh(geo,mats[c]);m.position.set(x+.5,y+.5,z+.5);m.userData.b=[x,y,z];scene.add(m);meshes.set(k,m);blocks.set(k,c)}
}

// ---------- hotbar ----------
let sel=0,mode='build',slots=[],alive=true,hp=100,held=false,cdT=0,kick=0;
const BATTLE=[['💣','Grenade'],['🔫','Gun'],['🔪','Knife']],CD=[1.2,.25,.5];
scene.add(cam);
const vm=new THREE.Group();cam.add(vm);
const vmM=(geo,col,pos)=>{const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:col}));m.position.set(...pos);vm.add(m);return m};
const vms=[vmM(new THREE.SphereGeometry(.09,12,8),0x3b7a3b,[.3,-.25,-.5]),vmM(new THREE.BoxGeometry(.07,.1,.45),0x2b2b2b,[.28,-.22,-.55]),vmM(new THREE.BoxGeometry(.03,.08,.4),0xcfd8dc,[.28,-.2,-.5])];
function updateVm(){vms.forEach((m,i)=>m.visible=mode==='battle'&&alive&&i===sel)}
function buildHotbar(){
  const hb=$('hotbar');hb.innerHTML='';slots=[];
  (mode==='build'?COLORS:BATTLE).forEach((c,i)=>{
    const d=document.createElement('div');
    if(mode==='build')d.style.background='#'+c.toString(16).padStart(6,'0');
    else{d.style.cssText='background:#2b3d4c;font-size:26px;display:grid;place-items:center';d.textContent=c[0];d.title=c[1]}
    const n=document.createElement('span');n.textContent=(i+1)%10;d.appendChild(n);hb.appendChild(d);slots.push(d);
  });
  pick(0);
}
function pick(i){const n=slots.length;sel=(i%n+n)%n;slots.forEach((e,j)=>e.classList.toggle('sel',j===sel));updateVm()}
function setMode(m){mode=m;held=false;buildHotbar();updateHud()}
function setHp(){$('hpf').style.width=hp+'%';$('hpf').style.background='hsl('+hp*1.2+',70%,42%)';$('hpt').textContent=hp}
function updateHud(){$('hud').textContent=(worldCode?'World code: '+worldCode+'\n':'')+(mode==='build'?'Building':'Battle')+' hotbar \u2013 press E to switch'}
buildHotbar();
addEventListener('wheel',e=>{if(playing)pick(sel+(e.deltaY>0?1:-1))});

// ---------- other players ----------
const others=new Map();
function nameTag(name){
  const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');
  x.font='bold 30px sans-serif';x.textAlign='center';x.textBaseline='middle';
  const w=Math.min(240,x.measureText(name).width);x.fillStyle='rgba(0,0,0,.6)';x.fillRect(128-w/2-10,8,w+20,48);
  x.fillStyle='#fff';x.fillText(name,128,33,240);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  s.scale.set(2,.5,1);s.position.y=2.25;s.renderOrder=10;return s;
}
function addPlayer(d){
  if(others.has(d.id))return;
  let h=0;for(const ch of d.name)h=(h*31+ch.charCodeAt(0))%360;
  const grp=new THREE.Group(),col=new THREE.Color('hsl('+h+',65%,50%)');
  const body=new THREE.Mesh(new THREE.BoxGeometry(.6,.9,.35),new THREE.MeshLambertMaterial({color:col}));body.position.y=.8;
  const head=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),new THREE.MeshLambertMaterial({color:0xf1c27d}));head.position.y=1.5;
  const nose=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.1),new THREE.MeshLambertMaterial({color:0x8d5524}));nose.position.set(0,1.5,-.28);
  const legs=new THREE.Mesh(new THREE.BoxGeometry(.5,.35,.3),new THREE.MeshLambertMaterial({color:0x333a55}));legs.position.y=.18;
  grp.add(body,head,nose,legs,nameTag(d.name));
  grp.position.set(...d.p);grp.rotation.y=d.r[0];scene.add(grp);
  others.set(d.id,{grp,tp:new THREE.Vector3(...d.p),ry:d.r[0]});
}
function clearOthers(){others.forEach(o=>scene.remove(o.grp));others.clear()}

// ---------- player physics ----------
const me={p:new THREE.Vector3(10,1.01,10),v:new THREE.Vector3(),yaw:0,pitch:0,ground:false};
const keys={};
function hits(x,y,z){
  const r=.3,e=1e-4;
  for(let i=Math.floor(x-r);i<=Math.floor(x+r-e);i++)for(let j=Math.floor(y);j<=Math.floor(y+1.8-e);j++)
    for(let k=Math.floor(z-r);k<=Math.floor(z+r-e);k++)if(blocks.has(K(i,j,k)))return true;
  return false;
}
function step(dt){
  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),n=Math.hypot(f,s)||1;
  me.v.x=(-Math.sin(me.yaw)*f+Math.cos(me.yaw)*s)/n*5;
  me.v.z=(-Math.cos(me.yaw)*f-Math.sin(me.yaw)*s)/n*5;
  if(keys.Space&&me.ground)me.v.y=8.5;
  me.v.y=Math.max(me.v.y-25*dt,-40);
  for(const a of ['x','y','z']){
    const old=me.p[a];if(a==='y')me.ground=false;
    me.p[a]+=me.v[a]*dt;
    if(hits(me.p.x,me.p.y,me.p.z)){me.p[a]=old;if(a==='y'&&me.v.y<0)me.ground=true;me.v[a]=0}
  }
  if(me.p.y<-30){me.p.set(10,3,10);me.v.set(0,0,0)}
}

// ---------- input ----------
let playing=false,chatOpen=false;
const locked=()=>document.pointerLockElement===cv;
const lock=()=>cv.requestPointerLock&&cv.requestPointerLock();
document.addEventListener('pointerlockchange',()=>{$('pause').hidden=!playing||locked()||chatOpen||!alive});
document.addEventListener('mousemove',e=>{if(!locked())return;me.yaw-=e.movementX*.0022;me.pitch=Math.max(-1.5,Math.min(1.5,me.pitch-e.movementY*.0022))});
$('resume').onclick=lock;$('pause').onclick=e=>{if(e.target.id==='pause')lock()};
addEventListener('contextmenu',e=>e.preventDefault());

const ray=new THREE.Raycaster();ray.far=6;
const aim=()=>{ray.setFromCamera({x:0,y:0},cam);return ray.intersectObjects([...meshes.values()])[0]};
cv.addEventListener('mousedown',e=>{
  if(!playing||chatOpen||!alive)return;if(!locked())return lock();if(mode==='battle'){if(e.button===0)held=true;return}
  const h=aim();if(!h)return;const b=h.object.userData.b;
  if(e.button===0)return send({t:'block',x:b[0],y:b[1],z:b[2],c:-1});
  if(e.button===2){
    const nx=b[0]+h.face.normal.x,ny=b[1]+h.face.normal.y,nz=b[2]+h.face.normal.z,p=me.p;
    if(nx<p.x+.3&&nx+1>p.x-.3&&ny<p.y+1.8&&ny+1>p.y&&nz<p.z+.3&&nz+1>p.z-.3)return;
    send({t:'block',x:nx,y:ny,z:nz,c:sel});
  }
});
addEventListener('mouseup',()=>held=false);
function attack(){
  if(cdT>0)return;cdT=CD[sel];kick=1;
  const d=new THREE.Vector3();cam.getWorldDirection(d);
  send({t:['throw','shoot','stab'][sel],d:d.toArray()});
}
const nades=[],fx=[],gGeo=new THREE.SphereGeometry(.15,10,8),gMat=new THREE.MeshLambertMaterial({color:0x3b7a3b});
function addNade(p,v,own){const m=new THREE.Mesh(gGeo,gMat);m.position.set(...p);scene.add(m);nades.push({m,v:new THREE.Vector3(...v),t:0,own})}
function stepNades(dt){
  for(let i=nades.length-1;i>=0;i--){
    const n=nades[i],q=n.m.position;n.t+=dt;n.v.y-=22*dt;
    for(const a of ['x','y','z']){
      const old=q[a];q[a]+=n.v[a]*dt;
      if(blocks.has(K(Math.floor(q.x),Math.floor(q.y),Math.floor(q.z)))){q[a]=old;n.v[a]*=-.45;if(a==='y'){n.v.x*=.8;n.v.z*=.8}}
    }
    if(n.t>=2.2){if(n.own)send({t:'boom',p:q.toArray()});scene.remove(n.m);nades.splice(i,1)}
  }
}
function boom(p){const m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xff9d2e,transparent:true}));m.position.set(...p);scene.add(m);fx.push({m,t:0,life:.45,grow:5})}
function tracer(o,e){o[1]-=.25;const m=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...o),new THREE.Vector3(...e)]),new THREE.LineBasicMaterial({color:0xffe066,transparent:true}));scene.add(m);fx.push({m,t:0,life:.12})}
function stepFx(dt){
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i],k=(f.t+=dt)/f.life;f.m.material.opacity=Math.max(0,.8*(1-k));
    if(f.grow)f.m.scale.setScalar(.3+f.grow*k);
    if(k>=1){scene.remove(f.m);f.m.geometry.dispose();fx.splice(i,1)}
  }
}
$('respawn').onclick=()=>{send({t:'respawn'});lock()};
$('leave').onclick=()=>{playing=false;if(ws)ws.close();location.reload()};
function openChat(){chatOpen=true;$('chat').classList.add('open');ci.style.display='block';Object.keys(keys).forEach(k=>keys[k]=false);document.exitPointerLock();ci.focus()}
function closeChat(){chatOpen=false;$('chat').classList.remove('open');ci.style.display='none';ci.value='';ci.blur();lock()}
addEventListener('keydown',e=>{
  if(document.activeElement===ci){
    if(e.key==='Enter'){const t=ci.value.trim();if(t)send({t:'chat',text:t});closeChat()}
    else if(e.key==='Escape')closeChat();
    return;
  }
  if(!playing)return;
  if(e.code==='KeyT'){e.preventDefault();return openChat()}
  if(e.code==='KeyE'&&alive&&!e.repeat){setMode(mode==='build'?'battle':'build');return}
  if(e.code==='Space')e.preventDefault();
  keys[e.code]=true;
  if(/^Digit\d$/.test(e.code)){const d=(+e.code[5]+9)%10;if(d<slots.length)pick(d)}
});
addEventListener('keyup',e=>keys[e.code]=false);

// ---------- chat / hud ----------
function logMsg(m){
  const d=document.createElement('div');
  if(m.sys){const i=document.createElement('i');i.textContent=m.text;d.appendChild(i)}
  else{const b=document.createElement('b');b.textContent=m.name+': ';d.append(b,m.text)}
  const L=$('log');L.appendChild(d);while(L.children.length>8)L.firstChild.remove();
}
let worldCode=null,isHost=false;
function refreshPause(){
  $('codebox').hidden=!worldCode;$('code').textContent=worldCode||'';
  $('openw').hidden=!(isHost&&!worldCode);
  updateHud();
}
$('openw').onclick=()=>send({t:'open'});

// ---------- network ----------
let ws,myId;
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function connect(first){
  $('err').textContent='';
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>send(first);
  ws.onerror=()=>{$('err').textContent='Cannot reach the server.'};
  ws.onclose=()=>{if(playing){alert('Disconnected from the server.');location.reload()}};
  ws.onmessage=e=>handle(JSON.parse(e.data));
}
function handle(m){
  switch(m.t){
    case 'error':$('err').textContent=m.msg;ws.close();break;
    case 'joined':
      myId=m.id;isHost=m.host;worldCode=m.code;
      [...meshes.keys()].forEach(k=>{const b=k.split(',').map(Number);setBlock(...b,-1)});
      m.blocks.forEach(b=>setBlock(...b));
      clearOthers();m.players.forEach(addPlayer);
      me.p.set(...m.spawn);me.v.set(0,0,0);me.yaw=0;me.pitch=-.3;
      alive=true;hp=100;setHp();$('dead').hidden=true;setMode('build');playing=true;$('menu').hidden=true;$('pause').hidden=false;refreshPause();lock();
      break;
    case 'opened':worldCode=m.code;refreshPause();logMsg({sys:true,text:'World is open. Code: '+m.code});break;
    case 'pjoin':addPlayer(m.p);break;
    case 'pleave':{const o=others.get(m.id);if(o){scene.remove(o.grp);others.delete(m.id)}break}
    case 'moves':m.l.forEach(([id,p,r])=>{const o=others.get(id);if(o){o.tp.set(...p);o.ry=r[0]}});break;
    case 'block':setBlock(m.x,m.y,m.z,m.c);break;
    case 'chat':logMsg(m);break;
    case 'hp':{
      const old=hp;hp=m.hp;setHp();
      if(hp<old){$('flash').style.opacity=.55;setTimeout(()=>$('flash').style.opacity=0,120)}
      if(hp<=0){alive=false;held=false;Object.keys(keys).forEach(k=>keys[k]=false);document.exitPointerLock();$('dead').hidden=false;updateVm()}
      break}
    case 'respawned':alive=true;hp=100;setHp();me.p.set(...m.spawn);me.v.set(0,0,0);$('dead').hidden=true;updateVm();lock();break;
    case 'throw':addNade(m.p,m.v,m.id===myId);break;
    case 'boom':boom(m.p);break;
    case 'shot':tracer(m.o,m.e);break;
  }
}
const nm=()=>{const n=$('name').value.trim();localStorage.setItem('bw-name',n);return n};
$('name').value=localStorage.getItem('bw-name')||'';
$('create').onclick=()=>connect({t:'create',name:nm()});
$('join').onclick=()=>{const c=$('jcode').value.trim();if(!c)return $('err').textContent='Enter a world code.';connect({t:'join',name:nm(),code:c})};
$('jcode').addEventListener('keydown',e=>{if(e.key==='Enter')$('join').click()});
setInterval(()=>{if(playing)send({t:'move',p:me.p.toArray().map(v=>+v.toFixed(2)),r:[+me.yaw.toFixed(3),+me.pitch.toFixed(3)]})},66);

// ---------- loop ----------
let last=performance.now();
(function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(playing&&alive)step(dt);
  stepNades(dt);stepFx(dt);cdT-=dt;kick=Math.max(0,kick-dt*6);vm.position.z=kick*.1;vm.rotation.x=kick*.3;
  if(held&&alive&&locked())attack();
  cam.position.set(me.p.x,me.p.y+1.62,me.p.z);cam.rotation.set(me.pitch,me.yaw,0);
  others.forEach(o=>{o.grp.position.lerp(o.tp,.25);o.grp.rotation.y=o.ry});
  const h=playing&&alive&&mode==='build'?aim():null;hl.visible=!!h;if(h)hl.position.copy(h.object.position);
  renderer.render(scene,cam);
})(last);
</script></body></html>
